[package]
name = "delta-funnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lightweight, fast Delta Lake to SQL Server loads with DataFusion SQL and native TDS"
readme = "../../README.md"
keywords = ["delta", "arrow", "mssql", "sql-server"]
categories = ["database"]

[[bin]]
name = "delta-funnel-perfetto"
path = "src/bin/delta_funnel_perfetto.rs"
required-features = ["perfetto-profile"]

[lints]
workspace = true

[package.metadata.cargo-machete]
# This direct dependency activates tracing on the transitive hyper-util instance.
ignored = ["hyper-util"]

[features]
perfetto-profile = [
    "dep:clap",
    "dep:flate2",
    "dep:hyper-util",
    "dep:perfetto-sdk",
    "dep:rkyv",
    "dep:same-file",
    "dep:serde",
    "dep:tempfile",
    "dep:zstd",
]

[dependencies]
async-trait = "0.1"
arrow-schema = "58.3.0"
arrow-sql-server = "0.4.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"], optional = true }
datafusion = { version = "54.1.0", default-features = false, features = [
    "sql",
] }
delta-arrow-reader = { version = "=0.1.2", features = ["datafusion", "official-kernel"] }
delta_kernel = { version = "=0.25.0", default-features = false, features = [
    "arrow",
    "internal-api",
] }
delta_kernel_default_engine = { version = "=0.25.0", default-features = false, features = [
    "arrow",
    "native-tls",
] }
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"], optional = true }
hyper-util = { version = "0.1.20", default-features = false, features = ["tracing"], optional = true }
libc = "0.2"
object_store = "0.13.2"
parquet = { version = "58.3.0", features = ["async", "object_store"] }
perfetto-sdk = { version = "1.0.3", optional = true }
rkyv = { version = "0.8.17", default-features = false, features = ["aligned", "bytecheck", "little_endian", "pointer_width_32", "std"], optional = true }
same-file = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
snafu = "0.9"
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2"
zstd = { version = "0.13", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
